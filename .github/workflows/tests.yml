name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff==0.16.9
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test requirements
        run: pip install -r requirements_test.txt
      - name: Run tests
        run: pytest tests -q

  card:
    name: Card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check card JavaScript
        run: node --check custom_components/anova_ble/frontend/anova-cooker-card.js
      - name: Install Playwright with Chromium
        run: |
          npm install --global playwright@1.63.0
          npx --yes playwright@1.63.0 install --with-deps chromium
      - name: Run card browser tests
        run: NODE_PATH="$(npm root --global)" node tests/frontend/render.mjs
